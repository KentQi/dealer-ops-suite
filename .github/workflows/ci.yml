name: CI

# 恢复自两个原仓（dealer-settlement / skinlane-contract-filler）的 CI，最小化合并版：
# 单 Python 版本（3.9，验证 README 兼容声明下限）、pytest 统一运行器（兼容 unittest 套件，
# 避免 pytest 文件在 unittest discover 下 0 用例的假绿）、插件清单/链接校验、公开仓脱敏自检。
# 重依赖的 PDF 结构回归走 pdf-regression 手动 job，不阻断主流程。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # gitleaks 全史扫描（增量 --log-opts=-1 只扫 1 commit 的静默降级已堵）
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.9"
          cache: pip
      - name: 安装锁定依赖
        run: python -m pip install -r requirements.txt
      - name: 语法编译
        run: python -m compileall -q skills/dealer-ops-suite/scripts
      - name: 全量测试（pytest 统一运行器）
        run: python -m pytest tests -q
      - name: 插件清单与 SKILL 校验
        run: python tools/validate.py
      - name: 公开仓脱敏自检（gitleaks 全史扫描）
        # 弃用 gitleaks-action：其在 push 事件下强制 --log-opts=-1（只扫 HEAD 一条
        # commit 的增量模式，fetch-depth: 0 也无效——T013 审计实测「1 commits scanned」）。
        # 直接以钉版本官方二进制跑全史，URL 内嵌版本号即供应链钉。
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks detect --log-opts="--all" --redact -v

  # 重依赖回归：pymupdf + 中文字体 + reportlab；手动触发，失败不视为合入阻断。
  pdf-regression:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖与中文字体
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: PDF 结构回归
        run: python -m pytest tests/test_pdf_structure.py -q
