name: CI

# 恢复自两个原仓（dealer-settlement / skinlane-contract-filler）的 CI，最小化合并版：
# 单 Python 版本（3.9，验证 README 兼容声明下限）、pytest 统一运行器（兼容 unittest 套件，
# 避免 pytest 文件在 unittest discover 下 0 用例的假绿）、插件清单/链接校验、公开仓脱敏自检。
# 重依赖的 PDF 结构回归走 pdf-regression 手动 job，不阻断主流程。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.9"
          cache: pip
      - name: 安装锁定依赖
        run: python -m pip install -r requirements.txt
      - name: 语法编译
        run: python -m compileall -q skills/dealer-ops-suite/scripts
      - name: 全量测试（pytest 统一运行器）
        run: python -m pytest tests -q
      - name: 插件清单与 SKILL 校验
        run: python tools/validate.py
      - name: 公开仓脱敏自检（gitleaks）
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 重依赖回归：pymupdf + 中文字体 + reportlab；手动触发，失败不视为合入阻断。
  pdf-regression:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖与中文字体
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - name: PDF 结构回归
        run: python -m pytest tests/test_pdf_structure.py -q
