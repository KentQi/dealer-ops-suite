<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dealer Ops Suite · 经销商运营全流程套件</title>
  <style>
    :root {
      --bg: #f6f3ec;
      --panel: #fffdf8;
      --ink: #1f2933;
      --muted: #5f6b76;
      --line: #ded7c9;
      --accent: #1f6f5c;
      --accent-2: #b7791f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at 15% 0%, #e8f0e9 0, transparent 38%), var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.65;
    }
    main {
      width: min(1040px, calc(100% - 48px));
      margin: 0 auto;
      padding: 72px 0 80px;
    }
    .eyebrow {
      display: inline-block;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--accent);
      font-size: 13px;
      letter-spacing: .08em;
      background: rgba(255, 253, 248, .72);
    }
    h1 {
      margin: 22px 0 14px;
      font-size: clamp(36px, 6vw, 64px);
      line-height: 1.08;
      letter-spacing: -.03em;
    }
    .lede {
      max-width: 720px;
      margin: 0 0 36px;
      color: var(--muted);
      font-size: 19px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
      margin: 34px 0 40px;
    }
    a.card {
      display: block;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      text-decoration: none;
      color: inherit;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    a.card:hover {
      transform: translateY(-3px);
      border-color: #b9ad98;
      box-shadow: 0 16px 36px rgba(31, 41, 51, .10);
    }
    .card span {
      display: inline-block;
      font-size: 12px;
      color: var(--accent-2);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .card h2 {
      margin: 8px 0 6px;
      font-size: 22px;
      letter-spacing: -.01em;
    }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 22px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }
    .meta a { color: var(--accent); text-decoration: none; }
    .meta a:hover { text-decoration: underline; }
    code {
      padding: 2px 5px;
      border-radius: 5px;
      background: #eee8dc;
      font-size: .92em;
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">DEALER OPS SUITE</div>
    <h1>经销商运营<br>全流程套件</h1>
    <p class="lede">
      把「谈客户 → 定政策 → 签合同 → 建台账 → 月度对账」串成一条可执行的工作流。
      公开脱敏版，所有客户、合同、银行与金额均为虚构示例。
    </p>

    <div class="grid">
      <a class="card" href="architecture.html">
        <span>Architecture</span>
        <h2>技能架构图</h2>
        <p>入口、插件清单、SKILL.md 路由、四类能力、支撑资源与交付物。</p>
      </a>
      <a class="card" href="business-workflow.html">
        <span>Workflow</span>
        <h2>业务流程图</h2>
        <p>从商务谈判、合同签署，到客户管理、台账待办与月度对账。</p>
      </a>
      <a class="card" href="https://github.com/KentQi/dealer-ops-suite#readme">
        <span>Repository</span>
        <h2>README</h2>
        <p>安装方式、目录结构、配置自己的合同模板与安全使用说明。</p>
      </a>
    </div>

    <div class="meta">
      <span>MIT License</span>
      <span>Python 3.9+</span>
      <span><a href="SANITIZATION.md">脱敏说明</a></span>
      <span><a href="https://github.com/KentQi/dealer-ops-suite">GitHub</a></span>
    </div>
  </main>
</body>
</html>
